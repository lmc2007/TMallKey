name: Deploy Landing Page

# 把 docs/ 目录作为 GitHub Pages 发布出去（落地页 + 下载入口）。
#
# 为什么用 Actions 部署而不是「从分支 /docs 部署」：
#   落地页要显示最新版本号 / 体积 / sha256 / 下载地址，这些都在 update/stable.json 里。
#   如果按分支部署，docs/ 里就得放一份清单副本，每次发版都要记得同步它，迟早会漂。
#   这里改成部署前把 update/stable.json 复制进站点根目录 —— 页面用同源相对路径读它，
#   既不依赖跨域，也不用维护镜像列表。
#
# 触发路径（部署逻辑本身在 deploy-pages.yml，本文件只是入口）：
#   1. push 到 main，且改动 docs/** 、update/stable.json 或两个 workflow 文件；
#   2. 手动 workflow_dispatch。
#
# ⚠️ 发版（Release APK）之后的自动部署**不在这里**：
#   原先这里挂过 `on: workflow_run: ["Release APK"]`，但 2026-10-11 发布 v1.0.4 时实测
#   该事件没有创建任何运行（触发链未送达），页面会停在上一个版本。现已改为由
#   release.yml 末尾的 landing job 显式调用 deploy-pages.yml —— 同一次 run 内串联，
#   不依赖事件投递。这里不再保留 workflow_run，避免将来它「突然生效」导致重复部署。

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "update/stable.json"
      - ".github/workflows/pages.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推上来就取消旧的，避免旧产物覆盖新站点。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/deploy-pages.yml
